<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactions</title>
<meta name="description" content="A library of web interactions. Press play on any cell to try it.">
<link rel="preload" href="fonts/Fragmentcore.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation -->
<header class="nav">
  <a class="nav-title" href="./">Interactions</a>
  <button class="nav-search" id="searchOpen" aria-label="Search interactions" aria-haspopup="dialog">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
</header>

<div class="app">
  <!-- Left panel: every interaction, no categories -->
  <nav class="left" aria-label="All interactions">
    <div class="panel-head"><span>Index</span><span id="count"></span></div>
    <ol class="list" id="list"></ol>
  </nav>

  <!-- Middle canvas: 3 or 4 columns, infinite rows -->
  <main class="canvas" id="canvas" aria-label="Interaction canvas">
    <div class="grid" id="grid"></div>
  </main>

  <!-- Right panel: details + extra controls of the selected interaction -->
  <aside class="right" id="right" aria-label="Interaction controls"></aside>
</div>

<!-- Search overlay -->
<div class="sx" id="sx" hidden>
  <div class="sx-back" data-close></div>
  <div class="sx-panel" role="dialog" aria-modal="true" aria-label="Search interactions">
    <div class="sx-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="sxInput" type="text" placeholder="Search interactions" autocomplete="off" spellcheck="false" aria-controls="sxRes">
      <button class="sx-esc" data-close aria-label="Close search">Esc</button>
    </div>
    <div class="sx-meta" id="sxMeta"></div>
    <ul class="sx-res" id="sxRes" role="listbox"></ul>
    <div class="sx-foot">Arrow keys to move · Enter to open · Esc to close</div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/demos/01-cards.js"></script>
<script src="js/demos/02-text.js"></script>
<script src="js/demos/03-forms.js"></script>
<script src="js/demos/04-fields.js"></script>
<script src="js/demos/05-physics-audio.js"></script>
<script src="js/demos/06-scroll-time-ai.js"></script>
<script src="js/demos/07-colorfield.js"></script>
<script src="js/demos/08-motion-lab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
