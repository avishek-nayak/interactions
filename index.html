<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactions</title>
<meta name="description" content="A library of web interactions. Press play on any cell to try it.">
<link rel="preload" href="fonts/Fragmentcore.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation -->
<header class="nav">
  <a class="nav-title" href="./">Interactions</a>
  <div class="nav-search" id="navSearch">
    <input id="searchInput" type="search" placeholder="Search interactions" autocomplete="off" spellcheck="false" aria-label="Search interactions" aria-controls="grid">
    <button class="nav-clear" id="searchClear" aria-label="Close search">Esc</button>
  </div>
  <button class="nav-btn" id="searchOpen" aria-label="Search interactions" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
</header>

<div class="app">
  <!-- Left panel: every interaction, no categories -->
  <nav class="left" aria-label="All interactions">
    <button class="rail" data-collapse="left" aria-label="Show index"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6M5 6l6 6-6 6"/></svg><span>Index</span></button>
    <div class="panel-body">
      <div class="panel-head"><span>Index</span><span class="ph-r"><span id="count"></span><button class="collapse" data-collapse="left" aria-label="Hide index"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6M19 6l-6 6 6 6"/></svg></button></span></div>
      <ol class="list" id="list"></ol>
    </div>
  </nav>

  <!-- Middle canvas: 3 or 4 columns, infinite rows -->
  <main class="canvas" id="canvas" aria-label="Interaction canvas">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <!-- Right panel: details + extra controls of the selected interaction -->
  <aside class="right" id="right" aria-label="Interaction controls">
    <button class="rail" data-collapse="right" aria-label="Show controls"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6M19 6l-6 6 6 6"/></svg><span>Controls</span></button>
    <div class="panel-body">
      <div class="panel-head"><span class="ph-l"><button class="collapse" data-collapse="right" aria-label="Hide controls"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>Selected</span><span id="rpCount"></span></div>
      <div id="rpBody"></div>
    </div>
  </aside>
</div>

<script src="js/core.js"></script>
<script src="js/demos/01-cards.js"></script>
<script src="js/demos/02-text.js"></script>
<script src="js/demos/03-forms.js"></script>
<script src="js/demos/04-fields.js"></script>
<script src="js/demos/05-physics-audio.js"></script>
<script src="js/demos/06-scroll-time-ai.js"></script>
<script src="js/demos/07-colorfield.js"></script>
<script src="js/demos/08-motion-lab.js"></script>
<script src="js/demos/09-santalarch.js"></script>
<script src="js/demos/10-enerblock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
